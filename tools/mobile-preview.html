<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手机尺寸预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7e1;color:#353934;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.toolbar{padding:18px 22px;display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}a,button{font:inherit;color:inherit}a{text-decoration:underline;text-underline-offset:5px}button{background:transparent;border:1px solid #bfc0b6;border-radius:4px;padding:7px 10px;cursor:pointer}.device{width:fit-content;margin:0 auto 28px;padding:8px;border-radius:20px;background:#323830;box-shadow:0 12px 40px #20282020}iframe{width:390px;height:844px;border:0;display:block;border-radius:13px;background:#f8f6f0}.toolbar span{color:#73796c;font-size:12px}a:focus-visible,button:focus-visible{outline:2px solid #b66d47;outline-offset:3px}</style></head><body><nav class="toolbar" aria-label="手机预览控制"><a href="/" target="mobile-frame">首页</a><a href="/ai-map/" target="mobile-frame">AI 地图</a><button data-width="360">360 px</button><button data-width="390">390 px</button><span>手机尺寸预览</span></nav><div class="device"><iframe name="mobile-frame" title="手机尺寸网页" src="/"></iframe></div><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';}));</script></body></html>
